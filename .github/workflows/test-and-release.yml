# Checks every push and pull request. A tag vX.Y.Z (or vX.Y.Z-beta.N) publishes the version on npm
# through trusted publishing (OIDC, no token): the package iobroker.bee trusts this workflow file of
# ioSofting/ioBroker.bee. Prereleases get the npm tag "next".
#
# Release: version in package.json, io-package.json (with news) and package-lock.json, changelog in the
# README as "### X.Y.Z (date)", commit, then: git tag vX.Y.Z && git push origin vX.Y.Z

name: Test and Release

on:
    push:
        branches: [main]
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # type check, lint and the package files (package.json, io-package.json)
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ubuntu-latest
        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '24.x'
                  type-checking: true
                  lint: true

    # unit tests and the start of the adapter in a js-controller, on all systems
    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        needs: [check-and-lint]
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  build: true

    deploy:
        needs: [ check-and-lint, adapter-tests ]

        # Permissions are required to create GitHub releases and npm trusted publishing
        permissions:
            contents: write
            id-token: write

        # Trigger this step only when a commit on any branch is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  build: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
